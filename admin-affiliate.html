<script id="kamar-global-header-script">
(function(){
  function pageName(){return (location.pathname.split('/').pop()||'index.html').toLowerCase();}
  function shouldShowHeader(){
    var p=pageName();
    if(p==='admin.html' || p.indexOf('admin-')===0) return true;
    if(p==='dashboard.html' || p.indexOf('member-')===0) return true;
    if(p==='affiliate-dashboard.html') return true;
    return false;
  }
  function clearSessionAndLogout(e){
    try{
      ['kamarAdminSession','kamarMemberSession','kamarAffiliateSession','kamarSession','kamarAuthSession','kamarCurrentUser'].forEach(function(k){localStorage.removeItem(k);});
    }catch(err){}
  }
  function buildHeader(){
    if(!shouldShowHeader()) return;
    document.querySelectorAll('header.site-header, header.kamar-global-header').forEach(function(h){h.remove();});
    var header=document.createElement('header');
    header.className='site-header kamar-global-header';
    header.innerHTML=''+
      '<a aria-label="Kamar Kajian Market" class="kamar-global-brand" href="index.html">'+
        '<img alt="Logo Kamar Kajian Market" src="assets/logo-kamar.jpeg" onerror="this.style.display=\'none\'"/>'+
        '<span>Kamar Kajian Market</span>'+
      '</a>'+
      '<nav aria-label="Navigasi utama" class="kamar-global-center"><a href="index.html">Beranda</a></nav>'+
      '<div class="kamar-global-actions">'+
        '<a class="kamar-global-btn" href="index.html">Beranda</a>'+
        '<a class="kamar-global-btn kamar-global-logout" data-kamar-logout href="index.html?logout=1&v=24ec" data-kamar-logout>Logout</a>'+
      '</div>';
    document.body.insertBefore(header, document.body.firstChild);
    var out=header.querySelector('[data-kamar-logout]');
    if(out) out.addEventListener('click', clearSessionAndLogout);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', buildHeader); else buildHeader();
})();
</script>

<script id="kamar-step24EA-global-loading-js">
(function(){
  if(window.__kamarGlobalLoading24EA) return; window.__kamarGlobalLoading24EA=true;
  function showToast(text){
    var old=document.getElementById('kamarLoadingToast'); if(old) old.remove();
    var t=document.createElement('div'); t.id='kamarLoadingToast'; t.className='kamar-loading-toast'; t.textContent=text||'Memproses...';
    document.body.appendChild(t); setTimeout(function(){if(t&&t.parentNode)t.remove();},9000);
  }
  function setButtonLoading(btn,text){
    if(!btn || btn.dataset.kamarLoading==='1') return;
    btn.dataset.kamarLoading='1'; btn.dataset.kamarOriginalText=btn.textContent||'';
    btn.classList.add('kamar-loading-active'); btn.disabled=true; btn.textContent=text||'Memproses...';
    setTimeout(function(){resetButton(btn);},12000);
  }
  function resetButton(btn){
    if(!btn || btn.dataset.kamarLoading!=='1') return;
    btn.classList.remove('kamar-loading-active'); btn.disabled=false; btn.textContent=btn.dataset.kamarOriginalText||btn.textContent||'Lanjut';
    delete btn.dataset.kamarLoading; delete btn.dataset.kamarOriginalText;
  }
  window.KamarLoading={show:showToast,setButton:setButtonLoading,resetButton:resetButton};
  document.addEventListener('submit',function(e){
    var form=e.target; if(!form || !form.querySelector) return;
    var btn=e.submitter || form.querySelector('button[type="submit"],input[type="submit"]');
    if(btn) setButtonLoading(btn, btn.dataset.loadingText || 'Memproses...');
    else showToast('Memproses...');
  },true);
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest ? e.target.closest('a,button') : null; if(!el) return;
    if(el.matches('button[type="submit"], input[type="submit"]')) return;
    if(el.matches('[data-no-loading], [data-affiliate-filter], #copyAffiliateCode, #copyDashCode, #affiliateSearchBtn, #editPayoutAccount, #sendPayoutAccount')) return;
    var href=el.getAttribute('href')||'';
    if(el.tagName==='A'){
      if(!href || href.charAt(0)==='#' || href.indexOf('javascript:')===0 || el.target==='_blank') return;
      showToast(el.dataset.loadingText || 'Memuat halaman...');
    }
  },true);
})();
</script>


<script id="kamar-global-logout-fix-24ec">
(function(){
  if(window.__KAMAR_LOGOUT_FIX_24EC__) return;
  window.__KAMAR_LOGOUT_FIX_24EC__ = true;

  function showLogoutLoading(){
    try{
      var old=document.getElementById('kamar-global-loading-overlay');
      if(old){ old.classList.add('show'); return; }
      var style=document.getElementById('kamar-global-loading-style');
      if(!style){
        style=document.createElement('style');
        style.id='kamar-global-loading-style';
        style.textContent='body.kamar-is-leaving{pointer-events:none}.kamar-loading-overlay{position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.18s ease}.kamar-loading-overlay.show{opacity:1;visibility:visible}.kamar-loading-box{border:1px solid rgba(235,207,130,.35);border-radius:28px;padding:24px 32px;background:linear-gradient(135deg,rgba(18,18,18,.92),rgba(15,28,24,.88));box-shadow:0 22px 70px rgba(0,0,0,.45);color:#fff7dc;font-weight:900;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:14px}.kamar-loading-spinner{width:20px;height:20px;border-radius:50%;border:3px solid rgba(235,207,130,.28);border-top-color:#f2dc8e;animation:kamarSpin24EC .75s linear infinite}@keyframes kamarSpin24EC{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);
      }
      var ov=document.createElement('div');
      ov.id='kamar-global-loading-overlay';
      ov.className='kamar-loading-overlay show';
      ov.innerHTML='<div class="kamar-loading-box"><span class="kamar-loading-spinner"></span><span>Memproses...</span></div>';
      document.body.appendChild(ov);
      document.body.classList.add('kamar-is-leaving');
    }catch(e){}
  }

  var explicitKeys = [
    'kamarAdminSession','kamarMemberSession','kamarAffiliateSession',
    'kamarSession','kamarAuthSession','kamarCurrentUser','kamarUserSession',
    'kamarLoggedIn','kamarAdminLogin','kamarMemberLogin','kamarAffiliateLogin',
    'kamarAuthRole','kamarUserRole','kamarLoginRole','kamarLastActivityAt'
  ];
  var sessionPattern = /^(kamar.*(session|login|auth|currentuser|current_user|role|token)|sb-.*auth-token|supabase\.auth\.token)$/i;

  function clearStorage(store){
    if(!store) return;
    try{
      explicitKeys.forEach(function(k){ try{store.removeItem(k);}catch(e){} });
      var keys=[];
      for(var i=0;i<store.length;i++){ keys.push(store.key(i)); }
      keys.forEach(function(k){
        if(!k) return;
        if(sessionPattern.test(k)){
          try{store.removeItem(k);}catch(e){}
        }
      });
    }catch(e){}
  }

  function clearCookies(){
    try{
      document.cookie.split(';').forEach(function(c){
        var name=c.split('=')[0].trim();
        if(!name) return;
        if(/^kamar/i.test(name) || /^sb-/i.test(name)){
          document.cookie=name+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
          document.cookie=name+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
        }
      });
    }catch(e){}
  }

  async function doLogout(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    showLogoutLoading();
    try{
      if(window.supabase && window.supabase.auth && typeof window.supabase.auth.signOut==='function'){
        try{ await window.supabase.auth.signOut(); }catch(x){}
      }
      if(window.kamarSupabase && window.kamarSupabase.auth && typeof window.kamarSupabase.auth.signOut==='function'){
        try{ await window.kamarSupabase.auth.signOut(); }catch(x){}
      }
    }catch(err){}
    clearStorage(window.localStorage);
    clearStorage(window.sessionStorage);
    clearCookies();
    setTimeout(function(){ window.location.replace('index.html?logout=1&v=24ec'); }, 180);
  }

  window.KamarLogoutAll = doLogout;

  function normalizeLogoutLinks(){
    try{
      document.querySelectorAll('a,button').forEach(function(el){
        var txt=(el.textContent||'').trim().toLowerCase();
        var href=(el.getAttribute && el.getAttribute('href')) || '';
        var hasLogoutAttr = el.hasAttribute && el.hasAttribute('data-kamar-logout');
        var looksLogout = hasLogoutAttr || txt==='logout' || txt.indexOf('logout')>=0;
        if(looksLogout){
          el.setAttribute('data-kamar-logout','');
          if(el.tagName && el.tagName.toLowerCase()==='a') el.setAttribute('href','index.html?logout=1&v=24ec');
        }
      });
    }catch(e){}
  }

  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    var el=t.closest('[data-kamar-logout], a, button');
    if(!el) return;
    var txt=(el.textContent||'').trim().toLowerCase();
    if(el.hasAttribute('data-kamar-logout') || txt==='logout' || txt.indexOf('logout')>=0){
      doLogout(e);
    }
  }, true);

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', normalizeLogoutLinks);
  else normalizeLogoutLinks();
  setTimeout(normalizeLogoutLinks, 700);
})();
</script>


<script id="kamar-universal-logout-hard-fix-24ec">
(function(){
  if(window.__KAMAR_UNIVERSAL_LOGOUT_24EC__) return;
  window.__KAMAR_UNIVERSAL_LOGOUT_24EC__ = true;

  var REDIRECT_URL = 'index.html?logout=1&v=24ec&t=' + Date.now();
  var explicitKeys = [
    'kamarAdminSession','kamarMemberSession','kamarAffiliateSession',
    'kamarSession','kamarAuthSession','kamarUserSession','kamarCurrentUser',
    'kamarLoggedIn','kamarAdminLogin','kamarMemberLogin','kamarAffiliateLogin',
    'kamarAuthRole','kamarUserRole','kamarLoginRole','kamarLastActivityAt',
    'kamarAdmin','kamarMember','kamarAffiliate','kamarUser',
    'KAMAR_ADMIN_SESSION','KAMAR_MEMBER_SESSION','KAMAR_AFFILIATE_SESSION'
  ];
  var authKeyPattern = /(session|login|auth|token|currentuser|current_user|role|loggedin|logged_in)/i;

  function safeRemove(store, key){ try{ store.removeItem(key); }catch(e){} }
  function clearStore(store){
    if(!store) return;
    try{
      explicitKeys.forEach(function(k){ safeRemove(store,k); });
      var keys=[];
      for(var i=0;i<store.length;i++){ var k=store.key(i); if(k) keys.push(k); }
      keys.forEach(function(k){
        var low=String(k||'').toLowerCase();
        if(/^sb-/.test(low) || low==='supabase.auth.token' || low.indexOf('supabase')>=0 && authKeyPattern.test(low)) safeRemove(store,k);
        else if(/^kamar/.test(low) && authKeyPattern.test(low)) safeRemove(store,k);
      });
    }catch(e){}
  }
  function clearCookies(){
    try{
      var names = document.cookie.split(';').map(function(c){return c.split('=')[0].trim();}).filter(Boolean);
      names.forEach(function(name){
        var low=name.toLowerCase();
        if(low.indexOf('sb-')===0 || low.indexOf('supabase')>=0 || low.indexOf('kamar')===0){
          ['/', location.pathname.replace(/\/[^\/]*$/,'/') || '/'].forEach(function(path){
            document.cookie = name+'=; Max-Age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT; path='+path;
          });
        }
      });
    }catch(e){}
  }
  function showOverlay(){
    try{
      var style=document.getElementById('kamar-logout-hard-style-24ec');
      if(!style){
        style=document.createElement('style');
        style.id='kamar-logout-hard-style-24ec';
        style.textContent='body.kamar-logging-out{pointer-events:none!important}.kamar-logout-overlay{position:fixed;inset:0;z-index:2147483647;background:rgba(3,3,3,.74);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}.kamar-logout-box{border:1px solid rgba(238,206,122,.38);border-radius:28px;padding:24px 32px;background:linear-gradient(135deg,rgba(14,14,13,.96),rgba(14,28,23,.92));box-shadow:0 24px 80px rgba(0,0,0,.55);color:#fff3d8;font-weight:1000;letter-spacing:.06em;display:flex;align-items:center;gap:14px}.kamar-logout-spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(238,206,122,.25);border-top-color:#f3df96;animation:kamarLogoutSpin24EC .7s linear infinite}@keyframes kamarLogoutSpin24EC{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);
      }
      var old=document.getElementById('kamarLogoutOverlay24EC');
      if(old) return;
      var ov=document.createElement('div');
      ov.id='kamarLogoutOverlay24EC';
      ov.className='kamar-logout-overlay';
      ov.innerHTML='<div class="kamar-logout-box"><span class="kamar-logout-spinner"></span><span>Memproses...</span></div>';
      document.body.appendChild(ov);
      document.body.classList.add('kamar-logging-out');
    }catch(e){}
  }
  function isLogoutEl(el){
    if(!el || !el.getAttribute) return false;
    var txt=(el.textContent||el.value||'').trim().toLowerCase();
    var href=(el.getAttribute('href')||'').toLowerCase();
    return el.hasAttribute('data-kamar-logout') || txt==='logout' || txt.indexOf('logout')>=0 || href.indexOf('logout=1')>=0;
  }
  function normalize(){
    try{
      document.querySelectorAll('a,button,input[type="button"],input[type="submit"]').forEach(function(el){
        if(isLogoutEl(el)){
          el.setAttribute('data-kamar-logout','true');
          if(el.tagName && el.tagName.toLowerCase()==='a') el.setAttribute('href', REDIRECT_URL);
          if(el.tagName && el.tagName.toLowerCase()==='button') el.setAttribute('type','button');
        }
      });
    }catch(e){}
  }
  async function signOutSupabase(){
    var candidates=[window.supabase, window.kamarSupabase, window.kamarSupabaseClient, window.KamarSupabaseClient];
    for(var i=0;i<candidates.length;i++){
      var c=candidates[i];
      try{ if(c && c.auth && typeof c.auth.signOut==='function') await c.auth.signOut(); }catch(e){}
    }
  }
  var running=false;
  async function logout(e){
    if(e){ e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }
    if(running) return false;
    running=true;
    showOverlay();
    clearStore(window.localStorage);
    clearStore(window.sessionStorage);
    clearCookies();
    try{ await signOutSupabase(); }catch(e){}
    clearStore(window.localStorage);
    clearStore(window.sessionStorage);
    clearCookies();
    setTimeout(function(){ window.location.replace(REDIRECT_URL); }, 250);
    return false;
  }
  window.KamarLogoutAll = logout;
  window.kamarLogoutAll = logout;

  ['pointerdown','click','submit'].forEach(function(evt){
    document.addEventListener(evt,function(e){
      var t=e.target;
      if(evt==='submit'){
        var form=t;
        if(form && form.querySelector && form.querySelector('[data-kamar-logout]')) logout(e);
        return;
      }
      var el=t && t.closest ? t.closest('a,button,input') : null;
      if(isLogoutEl(el)) logout(e);
    }, true);
  });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', normalize);
  else normalize();
  setInterval(normalize, 1000);
})();
</script>
