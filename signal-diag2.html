<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostik 2 Kamar Signal</title>
<link rel="stylesheet" href="/signal/assets/css/kamar-signal.css?v=diag4">
</head>
<body style="margin:0;">
<div id="ksigRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/kamar-config.js?v=diag4"></script>
<script src="/assets/js/kamar-supabase.js?v=diag4"></script>
<script>
(function(){
  var t0 = Date.now();
  var logEl = null;
  function dlog(msg){
    try{
      if(!logEl){
        logEl = document.getElementById('__ksigDebugLog') || document.createElement('div');
        if(!logEl.id){
          logEl.id = '__ksigDebugLog';
          logEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;background:rgba(0,0,0,.92);color:#0f0;font:10px/1.4 monospace;padding:8px;z-index:2147483647;white-space:pre-wrap;word-break:break-all;';
          (document.body||document.documentElement).appendChild(logEl);
        }
      }
      var line = document.createElement('div');
      line.textContent = '[diag4 ' + (Date.now()-t0) + 'ms] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }catch(e){}
  }

  window.addEventListener('error', function(ev){ dlog('WINDOW ERROR: ' + (ev && ev.message)); });
  window.addEventListener('unhandledrejection', function(ev){ dlog('UNHANDLED REJECTION: ' + (ev && ev.reason && (ev.reason.message||String(ev.reason)))); });

  dlog('TAHAP A: render markup boot + CSS');
  var el = document.getElementById('ksigRoot');
  el.innerHTML = '<div class="ksig-boot"><div class="ksig-boot-mark">Kamar Signal</div><div class="ksig-boot-sub">Diagnostik tahap A...</div></div>';

  var hbCount = 0;
  setInterval(function(){ hbCount++; dlog('HEARTBEAT #' + hbCount + ' (setInterval hidup)'); }, 3000);
  var rafCount = 0, lastRafLog = 0;
  function rafLoop(ts){
    rafCount++;
    if(ts - lastRafLog > 3000){ lastRafLog = ts; dlog('RAF-TICK #' + rafCount); }
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  setTimeout(function(){
    dlog('TAHAP B: coba fetch() PLAIN (TEKS SAJA, TIDAK dieksekusi) kamar-signal-app.js');
    var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ac ? setTimeout(function(){ dlog('TAHAP B: 15 detik lewat, ABORT fetch plain'); ac.abort(); }, 15000) : null;
    fetch('/signal/assets/js/kamar-signal-app.js?v=diag4b', { cache: 'no-store', signal: ac && ac.signal })
      .then(function(res){
        if(to) clearTimeout(to);
        dlog('TAHAP B: fetch() SELESAI, status=' + res.status);
        return res.text();
      })
      .then(function(txt){
        dlog('TAHAP B: .text() SELESAI, panjang=' + txt.length + ' -- FETCH PLAIN BERHASIL TOTAL, TIDAK macet.');
        dlog('TAHAP C: sekarang coba jalankan file itu SEBAGAI SCRIPT (eksekusi sungguhan)');
        var s = document.createElement('script');
        s.src = '/signal/assets/js/kamar-signal-app.js?v=diag4c';
        s.onload = function(){ dlog('TAHAP C: kamar-signal-app.js SELESAI DIMUAT (onload)'); };
        s.onerror = function(){ dlog('TAHAP C: kamar-signal-app.js GAGAL (onerror)'); };
        document.body.appendChild(s);
      })
      .catch(function(err){
        dlog('TAHAP B: fetch() PLAIN GAGAL/ABORT: ' + (err && err.message) + ' -- INI BUKTI: bahkan fetch teks biasa (tanpa eksekusi) SUDAH macet duluan!');
      });
  }, 6000);
})();
</script>
</body>
</html>
