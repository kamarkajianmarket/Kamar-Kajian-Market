<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostik 2 Kamar Signal</title>
<link rel="stylesheet" href="/signal/assets/css/kamar-signal.css?v=diag3">
</head>
<body style="margin:0;">
<div id="ksigRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/kamar-config.js?v=diag3"></script>
<script src="/assets/js/kamar-supabase.js?v=diag3"></script>
<script>
(function(){
  var t0 = Date.now();
  var logEl = null;
  function dlog(msg){
    try{
      if(!logEl){
        logEl = document.getElementById('__ksigDebugLog') || document.createElement('div');
        if(!logEl.id){
          logEl.id = '__ksigDebugLog';
          logEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;background:rgba(0,0,0,.92);color:#0f0;font:10px/1.4 monospace;padding:8px;z-index:2147483647;white-space:pre-wrap;word-break:break-all;';
          (document.body||document.documentElement).appendChild(logEl);
        }
      }
      var line = document.createElement('div');
      line.textContent = '[diag3 ' + (Date.now()-t0) + 'ms] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }catch(e){}
  }

  // PENTING: pasang error catcher SEBELUM load kamar-signal-app.js, supaya kalau ada
  // error sinkron di baris PALING AWAL file itu, kita TETAP bisa lihat pesannya
  // (watchdog error-catcher yang sudah ada di dalam kamar-signal-app.js sendiri baru
  // aktif di baris TERAKHIR file itu, jadi tidak berguna kalau error terjadi di awal).
  window.addEventListener('error', function(ev){
    dlog('WINDOW ERROR TERTANGKAP: ' + (ev && ev.message) + ' @ ' + (ev && ev.filename ? ev.filename.split('/').pop() + ':' + ev.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function(ev){
    dlog('UNHANDLED REJECTION: ' + (ev && ev.reason && (ev.reason.message || String(ev.reason))));
  });

  var ltCount = 0;
  try{
    if(typeof PerformanceObserver !== 'undefined'){
      var obs = new PerformanceObserver(function(list){
        list.getEntries().forEach(function(entry){ ltCount++; dlog('LONGTASK #' + ltCount + ': ' + Math.round(entry.duration) + 'ms'); });
      });
      obs.observe({ type: 'longtask', buffered: true });
    }
  }catch(e){ dlog('observer gagal: ' + e.message); }

  dlog('TAHAP A: render markup boot + CSS kamar-signal.css (TANPA kamar-signal-app.js dulu)');
  var el = document.getElementById('ksigRoot');
  el.innerHTML = '<div class="ksig-boot"><div class="ksig-boot-mark">Kamar Signal</div><div class="ksig-boot-sub">Diagnostik tahap A (CSS only)...</div></div>';

  var hbCount = 0;
  setInterval(function(){ hbCount++; dlog('HEARTBEAT #' + hbCount + ' (setInterval hidup), longtask: ' + ltCount); }, 3000);

  var rafCount = 0;
  var lastRafLog = 0;
  function rafLoop(ts){
    rafCount++;
    if(ts - lastRafLog > 3000){ lastRafLog = ts; dlog('RAF-TICK #' + rafCount + ' (requestAnimationFrame hidup)'); }
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  setTimeout(function(){
    dlog('TAHAP B: sekarang load kamar-signal-app.js SUNGGUHAN (file asli, 2121 baris)');
    var s = document.createElement('script');
    s.src = '/signal/assets/js/kamar-signal-app.js?v=diag3';
    s.onload = function(){ dlog('kamar-signal-app.js SELESAI DIMUAT (event onload terpicu)'); };
    s.onerror = function(){ dlog('kamar-signal-app.js GAGAL DIMUAT (event onerror terpicu)'); };
    document.body.appendChild(s);
    dlog('tag <script> utk kamar-signal-app.js SUDAH ditambahkan ke DOM, menunggu browser proses...');
  }, 6000);
})();
</script>
</body>
</html>
