<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostik 3 Kamar Signal</title>
</head>
<body style="margin:0;font-family:-apple-system,sans-serif;">
<div style="min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
  <div style="font-weight:900;font-size:20px;">Diagnostik 3: Parse vs Eksekusi</div>
  <div id="diagStatus" style="font-size:13px;color:#666;">Memuat...</div>
</div>
<script>
(function(){
  var t0 = Date.now();
  var logEl = null;
  function dlog(msg){
    try{
      if(!logEl){
        logEl = document.createElement('div');
        logEl.id = '__ksigDebugLog';
        logEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;background:rgba(0,0,0,.92);color:#0f0;font:11px/1.5 monospace;padding:8px;z-index:2147483647;white-space:pre-wrap;word-break:break-all;';
        (document.body||document.documentElement).appendChild(logEl);
      }
      var line = document.createElement('div');
      line.textContent = '[diag5 ' + (Date.now()-t0) + 'ms] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }catch(e){}
  }
  window.addEventListener('error', function(ev){ dlog('WINDOW ERROR: ' + (ev && ev.message)); });

  var hbCount = 0;
  setInterval(function(){ hbCount++; dlog('HEARTBEAT #' + hbCount + ' (setInterval hidup)'); }, 3000);
  var rafCount = 0, lastRafLog = 0;
  function rafLoop(ts){
    rafCount++;
    if(ts - lastRafLog > 3000){ lastRafLog = ts; dlog('RAF-TICK #' + rafCount); }
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  dlog('mulai fetch teks kamar-signal-app.js...');
  fetch('/signal/assets/js/kamar-signal-app.js?v=diag5', { cache: 'no-store' })
    .then(function(res){ return res.text(); })
    .then(function(txt){
      dlog('fetch teks SELESAI, panjang=' + txt.length);
      document.getElementById('diagStatus').textContent = 'Teks berhasil diambil (' + txt.length + ' char). Mencoba PARSE (new Function)...';

      dlog('MULAI new Function(txt) -- ini cuma PARSE, BELUM eksekusi...');
      var t_parse_start = Date.now();
      var fn;
      try{
        fn = new Function(txt);
        var parseDuration = Date.now() - t_parse_start;
        dlog('new Function() SELESAI (PARSE OK), butuh ' + parseDuration + 'ms. Fungsi TERBENTUK tapi BELUM dipanggil.');
        document.getElementById('diagStatus').textContent = 'PARSE OK (' + parseDuration + 'ms). Sekarang akan EKSEKUSI (panggil fungsinya)...';

        dlog('MULAI panggil fn() -- ini EKSEKUSI SUNGGUHAN, sama seperti kalau file dimuat sbg <script>...');
        setTimeout(function(){
          var t_exec_start = Date.now();
          try{
            fn();
            var execDuration = Date.now() - t_exec_start;
            dlog('fn() SELESAI DIPANGGIL (EKSEKUSI OK), butuh ' + execDuration + 'ms.');
          }catch(execErr){
            dlog('fn() ERROR saat eksekusi: ' + (execErr && execErr.message));
          }
        }, 500);
      }catch(parseErr){
        dlog('new Function() GAGAL PARSE: ' + (parseErr && parseErr.message));
      }
    })
    .catch(function(err){ dlog('fetch GAGAL: ' + (err && err.message)); });
})();
</script>
</body>
</html>
