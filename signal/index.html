<style id="ksig-intro-css">#ksigIntro{display:none}html.ksig-pre #ksigIntro,#ksigIntro.off{display:flex;position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#05070b;align-items:center;justify-content:center;flex-direction:column;gap:26px;transition:opacity .9s cubic-bezier(.2,.8,.2,1)}#ksigIntro.off{opacity:0;pointer-events:none}#ksigIntro img{width:84px;height:84px;border-radius:22px;box-shadow:0 0 0 1px rgba(232,199,119,.25),0 0 46px rgba(232,199,119,.28);animation:ksiPulse 2.2s ease-in-out infinite}#ksigIntro .b{width:132px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}#ksigIntro .b i{display:block;height:100%;width:45%;background:linear-gradient(90deg,transparent,#e8c777,transparent);animation:ksiBar 1.3s ease-in-out infinite}@keyframes ksiPulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.045);opacity:1}}@keyframes ksiBar{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}#ksigRoot{transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}html.ksig-pre #ksigRoot{opacity:0;transform:translateY(14px)}</style>
